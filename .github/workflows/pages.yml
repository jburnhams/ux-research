# Builds the ui-library docs and live examples into a static site and publishes it to GitHub Pages.
# Pull requests build and check the site without publishing; pushes to main publish it.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths: ["ui-library/**", "ux-design/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["ui-library/**", "ux-design/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-library/examples
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ui-library/examples/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Repo tests (palette, slop-lint, the example's lint)
        run: node --test ../../ux-design/tests/*.test.mjs
      - name: Typecheck, compile CSS, slop-lint
        run: npm run check
      - name: Build site
        run: npm run site
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_BRANCH: ${{ github.event.repository.default_branch }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui-library/examples/dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
